<style>
  :root{--primary:#1B8A5A;--primary-d:#146b46;--bg:#f4f6f5;--card:#fff;--text:#1c1c1e;--muted:#6b7280;--line:#e5e7eb;--gold:#f5b301;--red:#e11d48}
  @media (prefers-color-scheme:dark){:root:not([data-mode="light"]){--bg:#101312;--card:#1b1f1d;--text:#f2f2f2;--muted:#9ca3af;--line:#2b312e}}
  :root[data-mode="dark"]{--bg:#101312;--card:#1b1f1d;--text:#f2f2f2;--muted:#9ca3af;--line:#2b312e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
  button{font-family:inherit}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 6px}
  h1{margin:0;font-size:22px}
  .sub{font-size:12px;color:var(--muted)}
  .switch{position:relative;width:46px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#b9b9b9;border-radius:26px;transition:.2s}
  .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+.slider{background:var(--primary)}
  .switch input:checked+.slider:before{transform:translateX(20px)}
  .switch input:disabled+.slider{opacity:.5}
  .stats{display:flex;gap:10px;padding:6px 12px 2px}
  .stat{flex:1;background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .stat b{display:block;font-size:19px}
  .stat span{font-size:12px;color:var(--muted)}
  .tabs{display:flex;border-bottom:1px solid var(--line);margin:8px 0}
  .tabs button{flex:1;background:none;border:0;padding:11px 2px;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;font-weight:700}
  .tabs button.on{color:var(--primary);border-color:var(--primary)}
  .wrap{padding:6px 12px 12px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .muted{color:var(--muted);font-size:13px}
  .id{font-weight:800;font-size:16px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#e8f5ee;color:var(--primary)}
  .pill.warn{background:#fff3d6;color:#9a6a00}
  .pill.red{background:#ffe3e8;color:var(--red)}
  hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .btns{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--primary);font-size:15px;font-weight:700;background:var(--primary);color:#fff}
  .btn.out{background:transparent;color:var(--primary)}
  .btn.red{border-color:var(--red);color:var(--red);background:transparent}
  .btn[disabled]{opacity:.5}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{padding:10px 14px;border-radius:20px;border:1.5px solid var(--primary);color:var(--primary);background:transparent;font-weight:700;font-size:14px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav button{flex:1;background:none;border:0;padding:9px 0 11px;font-size:12px;color:var(--muted);font-weight:700}
  nav button .ic{display:block;font-size:21px;margin-bottom:1px}
  nav button.on{color:var(--primary)}
  #lmap{height:240px;border-radius:12px;margin-top:10px;position:relative;z-index:0;isolation:isolate}
  .emo div{font-size:20px;text-align:center;line-height:32px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.45);width:32px;height:32px}
  .rider{display:flex;align-items:center;gap:10px;margin-top:10px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
  .call{margin-left:auto;text-decoration:none;background:var(--primary);color:#fff;padding:9px 12px;border-radius:10px;font-weight:700;font-size:14px}
  .hero{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border-radius:16px;padding:18px;margin-bottom:10px}
  .hero .big{font-size:46px;font-weight:800;line-height:1.1}
  .bar{height:10px;background:rgba(255,255,255,.25);border-radius:8px;overflow:hidden;margin:12px 0 10px}
  .bar i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .4s}
  .tier{display:flex;align-items:center;gap:12px}
  .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:18px;flex:none}
  .dot.ok{background:var(--primary);color:#fff}
  .amt{margin-left:auto;font-weight:800;font-size:17px}
  .item{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .iconbtn{border:0;background:var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px}
  input[type=text],input[type=number],input[type=email],input[type=password],input[type=tel],input[type=time],select,textarea{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:15px;font-family:inherit}
  textarea{resize:vertical}
  .form{display:flex;gap:8px}
  .chart{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:8px}
  .chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .chart i{display:block;width:100%;background:var(--primary);border-radius:6px 6px 0 0;opacity:.85}
  .chart i.today{background:var(--gold);opacity:1}
  .chart span{font-size:11px;color:var(--muted);margin-top:4px}
  .seg{display:flex;gap:8px;padding:6px 12px 4px}
  .seg button{flex:1;padding:11px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:14px}
  .seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .logo{width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800;overflow:hidden;flex:none}
  .logo img,.mth img,.photo img{width:100%;height:100%;object-fit:cover}
  .lbl{font-size:13px;font-weight:700;margin-bottom:5px}
  .sec{font-weight:800;margin:4px 0 12px;font-size:16px}
  .mi{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .mth{width:92px;height:92px;border-radius:12px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:38px;position:relative;flex:none}
  .sold{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
  .mi.off .mbody{opacity:.65}
  .mbody{flex:1;min-width:0}
  .desc{margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .catbar{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px}
  .catbar button{flex:none;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font-weight:700;font-size:13px}
  .catbar button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
  .sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px}
  .photo{margin-top:12px;width:100%;height:170px;border-radius:14px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:60px}
  .cover{height:96px;margin:-14px -14px 0}
  .plogo{margin-top:-38px;border:4px solid var(--card)}
  .tagc{display:inline-block;padding:7px 12px;border-radius:20px;border:1.5px solid var(--line);margin:0 6px 8px 0;font-size:13px;font-weight:700;background:transparent;color:var(--muted)}
  .tagc.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;margin-right:8px;display:inline-block;padding:0}
  .sw.on{border-color:var(--text)}
  .chk{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
  .chk i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--line);color:var(--muted);flex:none}
  .chk i.ok{background:var(--primary);color:#fff}
  .tm{display:flex;gap:10px;margin-top:10px}
  .tm>div{flex:1}
  .srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;gap:10px}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .ov.show{display:flex}
  .osheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px 28px;text-align:center}
  .bell{font-size:56px;display:inline-block;animation:ring .8s infinite;transform-origin:50% 10%}
  @keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-16deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}75%{transform:rotate(4deg)}}
  .big2{font-size:22px;font-weight:800;margin:4px 0 6px}
  .odc{background:var(--bg);border-radius:14px;padding:12px;text-align:left;margin:12px 0}
  .cd{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
  .cd i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
  .login{max-width:420px;margin:0 auto;padding:36px 16px}
  .brand{width:76px;height:76px;border-radius:22px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:38px;margin:0 auto 14px}
  .pack{border:2px dashed var(--primary);border-radius:14px;padding:12px;margin-top:12px;background:color-mix(in srgb,var(--primary) 7%,transparent)}
  .pnum{font-size:44px;font-weight:900;letter-spacing:6px;color:var(--primary);line-height:1.1}
  .pthumb{width:74px;height:74px;border-radius:12px;object-fit:cover;border:2px solid var(--line);flex:none}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-weight:800;padding:16px}
  .lb.show{display:flex}.lb img{max-width:100%;max-height:78vh;border-radius:12px}
  .aprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .loading{text-align:center;padding:90px 20px;color:var(--muted)}
.dz{display:flex;align-items:center;gap:12px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer}.dz img{width:56px;height:56px;object-fit:cover;border-radius:8px}.dz>span{font-size:28px;width:56px;text-align:center}
  .seg.sc{overflow-x:auto;padding-bottom:6px}.seg.sc button{flex:none;padding:11px 14px;white-space:nowrap}
  #offl{display:none;position:sticky;top:0;z-index:70;background:var(--red);color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700}
  .pz{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff3d6;color:#7a5a00;border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .note3{background:#fff8e1;color:#5c4400;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:14px}
  .kg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kg .stat b{font-size:20px}
  .chart.tight{gap:3px}.chart.tight span{font-size:10px;height:12px;white-space:nowrap}
  .hbr{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}.hbr span{flex:0 0 38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbt{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.hbt i{display:block;height:100%;background:var(--primary);border-radius:6px}
  .schr{display:flex;align-items:center;gap:8px;padding:5px 0}.schr>span{width:58px;font-weight:700;font-size:14px}.schr input[type=time]{flex:1;padding:8px;font-size:14px;min-width:0}
  nav button{position:relative}nav .nb{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
  .dmtab{position:fixed;right:0;bottom:calc(150px + env(safe-area-inset-bottom));z-index:40;width:30px;height:56px;border:0;border-radius:14px 0 0 14px;background:#111;color:#ffd400;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:0}
  .dmbg{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}.dmsheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom))}
  .dmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dmgrid button{padding:13px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-weight:700;font-size:13px;text-align:center}
  #pa{display:none}.kot{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:#000;max-width:300px}.kot h2{margin:0;text-align:center;font-size:17px}.kot .c{text-align:center}.kot .rw{display:flex;justify-content:space-between}.kot .it{font-size:15px;font-weight:700;margin:3px 0}.kot hr{border-top:1px dashed #000}
  @media print{body>*{display:none!important}body>#pa{display:block!important}body{background:#fff;padding:0}}
  .lmap{height:190px;border-radius:12px;margin-top:10px;position:relative;z-index:0;isolation:isolate}
  .hdr2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
  .hdr2 h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr2 .ctl{display:flex;align-items:center;gap:10px;flex:none}
  .tbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:19px;padding:0}
  .boost{background:linear-gradient(135deg,#fff7e0,#ffe9a8);color:#5c4400;border-radius:16px;padding:16px;text-align:center}
  .boost .chip{border-color:#b98200;color:#7a5a00;background:rgba(255,255,255,.6)}
  .payb{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:20px}

  .camb{position:absolute;display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(0,0,0,.62);color:#fff;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer}

  .catl{max-height:56vh;overflow-y:auto;margin:10px 0}

  .mc.off{opacity:.65}
  .mct{height:96px;border-radius:10px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:36px;position:relative}

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600);}
function mmss(ms){ms=Math.max(0,Math.round(ms/1000));const m=Math.floor(ms/60),s=ms%60;return m+":"+(s<10?"0":"")+s;}
function hhmm(ms){const d=new Date(ms);return d.getHours()+":"+("0"+d.getMinutes()).slice(-2);}
function tmin(s){const a=(s||"0:0").split(":");return (+a[0])*60+(+a[1]);}
function inHours(){
  const p=S.profile,t=new Date(),m=t.getHours()*60+t.getMinutes();
  if(!p.useSched){const o=tmin(p.open),c=tmin(p.close);return o<=c?(m>=o&&m<c):(m>=o||m<c);}
  const c=dayCfg(t),o=tmin(c.open),cl=tmin(c.close);
  if(o<=cl)return !!c.on&&m>=o&&m<cl;
  if(c.on&&m>=o)return true;
  const y=dayCfg(new Date(t.getTime()-86400000));
  return !!y.on&&tmin(y.open)>tmin(y.close)&&m<tmin(y.close);
}
function shopLoc(){return (S.profile.lat!=null&&S.profile.lng!=null)?{lat:+S.profile.lat,lng:+S.profile.lng}:DEFAULT_LOC;}
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function expires(o){return o.expiresAt||((o.created||Date.now())+ACCEPT_MS);}
function pend(){const n=Date.now();return S.orders.filter(o=>o.status==="new"&&expires(o)>n).sort((a,b)=>a.created-b.created);}
function cnt(st){return S.orders.filter(o=>o.status===st).length;}
const OUT_PROFILE_KEYS=Object.keys(DEF);

// ===== Sound / alerts =====================================================
let AC=null,master=null,ringT=null,flashT=null;
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=S.profile.vol;master.connect(AC.destination);}catch(e){AC=null;}}
  if(AC&&AC.state==="suspended"){try{AC.resume();}catch(e){}}
}
document.addEventListener("click",ensureAudio,{passive:true});
function beep(f,start,dur,type){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(master);const t=AC.currentTime+start;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.05);}
function playOnce(){if(!AC)return;const T=TUNES[S.profile.tune]||TUNES.bell;let at=0;T.notes.forEach(n=>{beep(n[0],at,n[1],T.type);at+=n[1]+.03;});}
function startRing(){stopRing();playOnce();if(S.profile.repeat){ringT=setInterval(()=>{if(pend().length)playOnce();else stopRing();},2400);}}
function stopRing(){clearInterval(ringT);ringT=null;}
function startFlash(){if(flashT)return;let on=false;flashT=setInterval(()=>{const n=pend().length;if(!n){stopFlash();return;}on=!on;document.title=on?"🔔 ("+n+") NAYA ORDER!":"Foodie Bitez Merchant";},900);}
function stopFlash(){clearInterval(flashT);flashT=null;document.title="Foodie Bitez Merchant";}
function newAlert(o){
  if(S.profile.autoAccept&&S.profile.storeOpen){playOnce();return;}
  startRing();startFlash();
  if(S.profile.vib){try{if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);}catch(e){}}
  if(S.profile.notif&&("Notification" in window)&&Notification.permission==="granted"){
    try{new Notification("🔔 Naya order #"+String(o.id).slice(-4).toUpperCase(),{body:(o.customer||"Customer")+" - Rs "+(o.total||0),tag:"order-"+o.id,requireInteraction:true});}catch(e){}
  }
}
function askNotif(){if(S.profile.notif&&("Notification" in window)&&Notification.permission==="default"){try{Notification.requestPermission();}catch(e){}}}

const authHandler=async user=>{
  if(DM.on&&(!user||user.uid!=="demo"))return;
  if(unsubMenu){unsubMenu();unsubMenu=null;}
  if(unsubOrders){unsubOrders();unsubOrders=null;}
  if(unsubAppeals){unsubAppeals();unsubAppeals=null;}
  stopRing();stopFlash();
  S.busy=false;
  if(!user){S.user=null;S.orders=[];S.menu=[];S.appeals=[];S.ap=null;applyWake();render();showOverlay();return;}
  S.user=user;
  try{
    const ref=doc(db,"merchants",user.uid),snap=await getDoc(ref);
    if(snap.exists())S.profile={...DEF,...snap.data()};
    else{S.profile={...DEF};await setDoc(ref,{...profileData(),email:user.email,createdAt:Date.now()});}
  }catch(e){toast("Database nahi khuli. Firestore chalu karein ("+(e.code||e.message)+")");}
  unsubMenu=onSnapshot(collection(db,"merchants",user.uid,"menu"),snap=>{
    S.menu=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(S.page==="menu"&&!S.draft&&!S.st)render();
    if(!S.stChecked&&!S.menu.length){maybeStarter();}else S.stChecked=true;
  },e=>toast("Menu load nahi hua: "+(e.code||e.message)));
  unsubOrders=onSnapshot(query(collection(db,"orders"),where("merchantId","==",user.uid)),snap=>{
    S.orders=snap.docs.map(d=>{const x=d.data({serverTimestamps:"estimate"});const c=x.createdAt&&x.createdAt.toMillis?x.createdAt.toMillis():(x.createdAt||Date.now());return {id:d.id,...x,created:c};});
    snap.docChanges().forEach(ch=>{
      if(ch.type==="added"){const o=S.orders.find(x=>x.id===ch.doc.id);if(o&&o.status==="new"&&expires(o)>Date.now())newAlert(o);}
    });
    if(!pend().length){stopRing();stopFlash();}
    refresh();
  },e=>toast("Orders load nahi hue: "+(e.code||e.message)));
  unsubAppeals=onSnapshot(query(collection(db,"appeals"),where("merchantId","==",user.uid)),snap=>{
    S.appeals=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(S.page==="earnings"&&!S.ap)render();
  },e=>toast("Appeals load nahi hue: "+(e.code||e.message)));
  if(unsubBids)unsubBids();unsubBids=onSnapshot(collection(db,"adBids"),snap=>{S.bids=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.page==="ads"&&!S.adBusy)render();},()=>{});
  applyWake();
  render();
};

// ===== Map (Leaflet): har order card ke andar apna live map ================
const maps={};
function emo(e){return L.divIcon({className:"emo",html:"<div>"+e+"</div>",iconSize:[32,32],iconAnchor:[16,16]});}
function activeRiders(){return S.orders.filter(o=>["preparing","ready","onway"].includes(o.status));}
function updateMap(){
  const slots=document.querySelectorAll("[id^=mapslot-]");
  if(typeof L==="undefined"){slots.forEach(sl=>{sl.innerHTML='<div class="muted" style="margin-top:10px">Map load nahi hua. Internet check karein.</div>';});return;}
  const s=shopLoc(),seen={};
  slots.forEach(sl=>{
    const id=sl.id.slice(8),o=S.orders.find(x=>x.id===id);if(!o)return;
    seen[id]=1;
    let m=maps[id];
    if(!m){
      const el=document.createElement("div");el.className="lmap";
      const map=L.map(el).setView([s.lat,s.lng],14);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
      m=maps[id]={el,map,shop:L.marker([s.lat,s.lng],{icon:emo("🏪")}).addTo(map),rider:null,fit:""};
    }
    if(m.el.parentNode!==sl)sl.appendChild(m.el);
    m.map.invalidateSize();
    m.shop.setLatLng([s.lat,s.lng]);
    const has=o.riderLoc&&o.riderLoc.lat!=null;
    if(has){
      const ll=[o.riderLoc.lat,o.riderLoc.lng];
      if(!m.rider)m.rider=L.marker(ll,{icon:emo("🛵")}).addTo(m.map).bindTooltip(o.riderName||"Rider",{permanent:true,direction:"top",offset:[0,-14]});
      else m.rider.setLatLng(ll);
    }else if(m.rider){m.map.removeLayer(m.rider);m.rider=null;}
    const key=has?"r":"s";
    if(key!==m.fit){
      m.fit=key;
      if(has)m.map.fitBounds([[s.lat,s.lng],[o.riderLoc.lat,o.riderLoc.lng]],{padding:[40,40],maxZoom:16});
      else m.map.setView([s.lat,s.lng],15);
    }
  });
  Object.keys(maps).forEach(id=>{if(!seen[id]){try{maps[id].map.remove();}catch(e){}delete maps[id];}});
}

function etaText(o){
  if(!o.riderName)return "Rider assign hone ka intezar hai";
  if(!o.riderLoc||o.riderLoc.lat==null)return o.riderName+" ki location ka intezar hai";
  const tgt=o.status==="onway"?(o.custLoc||shopLoc()):shopLoc();
  const d=km(o.riderLoc,tgt),m=Math.max(1,Math.round(d/20*60));
  if(o.status!=="onway")return d<0.05?"Rider pahunch gaya":"Rider "+m+" min mein pahunch raha hai ("+d.toFixed(1)+" km)";
  return d<0.05?"Customer ke paas pahunch gaya":"Customer tak "+m+" min ("+d.toFixed(1)+" km)";
}

function badge(o){
  if(o.status==="new")return `<span class="pill warn" id="tm-${o.id}">Accept karein: ${mmss(expires(o)-Date.now())}</span>`;
  if(o.status==="preparing"){const r=(o.readyAt||0)-Date.now();return `<span class="pill ${r<=0?"red":""}" id="pt-${o.id}">${r<=0?"Time khatam":"Baaki "+mmss(r)}</span>`;}
  if(o.status==="ready")return `<span class="pill">Ready</span>`;
  return `<span class="pill">Raaste mein</span>`;
}
const chooseOpen={};
function isCash(o){return /cash|cod|delivery/i.test(String(o.pay||""));}
function payBadge(o){return isCash(o)?`<span class="payb cash">💵 Cash on Delivery</span>`:`<span class="payb on">💳 Online paid${o.pay?" · "+esc(o.pay):""}</span>`;}
function actions(o){
  if(o.status==="new")return `<div style="margin-top:12px;font-weight:700">⏱ Kitne time mein ready kar sakte hain?</div><div class="chips">${[10,20,30].map(m=>`<button class="chip" onclick="act('${o.id}','prep',${m})">${m} min</button>`).join("")}</div><div class="muted" style="margin-top:6px">Time chunne par order "Preparing" mein chala jayega.</div><div class="btns"><button class="btn red" style="padding:9px" onclick="act('${o.id}','reject')">Reject</button></div>`;
  if(o.status==="preparing")return `<div class="btns"><button class="btn out" style="flex:none" onclick="act('${o.id}','extend')">⏱ +5 min</button><button class="btn" onclick="act('${o.id}','ready')">✅ Pack ho gaya, Ready</button></div>`;
  if(o.status==="ready")return `<div class="btns"><button class="btn" onclick="act('${o.id}','handover')">Rider ko de diya</button></div>`;
  return "";
}
function riderBlock(o){
  if(o.status==="new")return "";
  const asg=!!o.riderName;
  const msg=o.status==="preparing"?(asg?"Rider assign ho gaya, aa raha hai":"Rider assign ho raha hai..."):o.status==="ready"?(asg?"Rider order lene aa raha hai":"Rider ka intezar hai"):"Rider raaste mein hai";
  let h=`<div class="rstat"><div class="av">${asg?esc(o.riderName[0]):"🛵"}</div><div style="min-width:0"><div style="font-weight:700">${asg?esc(o.riderName)+" · ":""}${msg}</div><div class="muted" id="eta-${o.id}">${esc(etaText(o))}</div></div>${o.riderPhone?`<a class="call" href="tel:${esc(o.riderPhone)}">📞</a>`:""}</div>`;
  if(asg)h+=`<div id="mapslot-${o.id}"></div>`;
  return h;

  const list=S.orders.filter(o=>o.status===S.tab).sort((a,b)=>b.created-a.created);

  h+=`<div class="tabs">${[["new","New"],["preparing","Preparing"],["ready","Ready"],["onway","On way"]].map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="setTab('${t[0]}')">${t[1]} (${cnt(t[0])})</button>`).join("")}</div><div class="wrap">`;
  if(!list.length)h+=anyActive?`<div class="empty">Is tab mein koi order nahi</div>`:boostCard();

    <div class="row" style="margin-top:6px"><span class="muted">${esc(o.customer||"Customer")} &middot; ${esc(o.addr||"")}</span><b>Rs ${esc(o.total||0)}</b></div>

  });

function setTab(t){S.tab=t;render();}
function act(id,type,arg){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  if(type==="choose"){chooseOpen[id]=true;render();return;}
  if(type==="prep"){delete chooseOpen[id];orderUpdate(id,{status:"preparing",readyAt:Date.now()+arg*60000,acceptedAt:Date.now(),packCode:genCode()});toast("Order accept ho gaya");if(cnt("new")<=1)S.tab="preparing";}
  else if(type==="reject"){S.rj=id;render();}
  else if(type==="extend"){const b=Math.max(Date.now(),o.readyAt||0);orderUpdate(id,{readyAt:b+300000,extended:(o.extended||0)+1});toast("Taiyari ka time 5 min barh gaya");}
  else if(type==="code"){orderUpdate(id,{packCode:genCode()});}
  else if(type==="ready"){orderUpdate(id,{status:"ready",readyActualAt:Date.now(),packCode:o.packCode||genCode()});if(cnt("preparing")<=1)S.tab="ready";}
  else if(type==="handover"){orderUpdate(id,{status:"onway",pickedAt:Date.now()});}
}

function genCode(){return String(Math.floor(1000+Math.random()*9000));}
function compress(file,max,q){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q));};im.onerror=rej;im.src=r.result;};

  });

function thumb(m){const b=m.video?'<i class="vb">🎬</i>':"";return (m.img?`<img src="${m.img}" alt="">`:`<span>${CAT_EMO[m.cat]||"🍽️"}</span>`)+b;}
function eff(m){return +m.price||0;}
function filteredMenu(){
  const q=(S.mq||"").toLowerCase();
  return S.menu.map((m,i)=>({m,i})).filter(x=>{const m=x.m;if(S.mc!=="All"&&m.cat!==S.mc)return false;if(q&&((m.name||"")+" "+(m.desc||"")).toLowerCase().indexOf(q)<0)return false;return true;});
}
function mcard(x){
  const m=x.m,i=x.i,off=m.mrp>m.price?Math.round((1-m.price/m.mrp)*100):0;
  return `<div class="mc ${m.on?"":"off"}"><div class="mct">${thumb(m)}${m.on?"":'<div class="sold">Sold out</div>'}</div><div style="font-weight:800;font-size:14px;margin-top:6px">${esc(m.name)} ${m.pop?"⭐":""}${m.spicy?"🌶️":""}${m.veg?"🥬":""}</div><div class="row" style="margin-top:2px"><b style="color:var(--primary)">${pr(m)}</b>${off?`<span style="color:var(--red);font-size:11px;font-weight:800">${off}% off</span>`:""}</div><div class="row" style="margin-top:8px"><button class="iconbtn" onclick="openEdit(${i})">✏️</button><label class="switch"><input type="checkbox" ${m.on?"checked":""} onchange="toggleItem('${m.id}',this.checked)"><span class="slider"></span></label></div></div>`;
}
function menuCards(arr,lay){
  if(lay==="grid")return `<div class="mgrid">${arr.map(x=>mcard(x)).join("")}</div>`;
  const g={},order=[];
  arr.forEach(x=>{const c=x.m.cat||"Other";if(!g[c]){g[c]=[];order.push(c);}g[c].push(x);});
  return order.map(c=>`<div class="sec" style="margin:14px 0 8px">${CAT_EMO[c]||""} ${esc(c)}</div><div class="mslide">${g[c].map(x=>mcard(x)).join("")}</div>`).join("");
}
function menuItems(){
  const arr=filteredMenu(),so=S.ms;
  if(so==="az")arr.sort((a,b)=>String(a.m.name).localeCompare(String(b.m.name)));
  else if(so==="lo")arr.sort((a,b)=>eff(a.m)-eff(b.m));
  else if(so==="hi")arr.sort((a,b)=>eff(b.m)-eff(a.m));
  else if(so==="off")arr.sort((a,b)=>(a.m.on?1:0)-(b.m.on?1:0));
  const lay=S.profile.layout||"list";
  if(lay!=="list"&&arr.length)return menuCards(arr,lay);
  let out="";
  arr.forEach(x=>{
    const m=x.m,i=x.i,off=m.mrp>m.price?Math.round((1-m.price/m.mrp)*100):0;
    out+=`<div class="mi ${m.on?"":"off"}"><div class="mth">${thumb(m)}${m.on?"":'<div class="sold">Sold out</div>'}</div>
     <div class="mbody"><div class="row" style="align-items:flex-start"><div style="font-weight:800;font-size:16px">${esc(m.name)} ${m.pop?"⭐":""}${m.spicy?"🌶️":""}${m.veg?"🥬":""}</div><div style="text-align:right;white-space:nowrap"><b style="color:var(--primary)">Rs ${esc(m.price)}</b>${off?`<div class="muted"><s>Rs ${esc(m.mrp)}</s> <span style="color:var(--red);font-weight:800">${off}% off</span></div>`:""}</div></div>
     <div class="muted desc">${esc(m.desc||"Description nahi hai")}</div>
     <div class="row" style="margin-top:8px"><span class="pill">${esc(m.cat||"Other")}</span><div class="row"><button class="iconbtn" onclick="openEdit(${i})">✏️ Edit</button>
     <label class="switch"><input type="checkbox" ${m.on?"checked":""} onchange="toggleItem('${m.id}',this.checked)"><span class="slider"></span></label></div></div></div></div>`;
  });
  return arr.length?out:'<div class="empty">Koi item nahi mila. Upar "+ Naya item" dabayein.</div>';
}
function setMs(v){S.ms=v;$("#mlist").innerHTML=menuItems();}
async function bulkAvail(v){

function openEdit(i){S.editIdx=i;S.draft=i<0?{name:"",price:"",mrp:"",cat:"Fast Food",desc:"",img:"",video:"",on:true,pop:false,spicy:false,veg:false}:JSON.parse(JSON.stringify(S.menu[i]));if(!S.draft.cat)S.draft.cat="Other";render();}
function closeEdit(){S.draft=null;render();}
function onD(k,v){S.draft[k]=v;}
function setDraftCat(v){S.draft.cat=v;render();}
function pickPhoto(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const sz=480,c=document.createElement("canvas"),m=Math.min(im.width,im.height);c.width=c.height=sz;c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,sz,sz);S.draft.img=c.toDataURL("image/jpeg",.72);render();};im.src=r.result;};
  r.readAsDataURL(f);
}
function clearPhoto(){S.draft.img="";render();}
function videoBlock(d){
  const up=S.vup!=null;
  return `<div style="margin-top:12px">${d.video?`<video src="${esc(d.video)}" controls playsinline preload="metadata" style="width:100%;max-height:220px;border-radius:12px;background:#000"></video>`:""}
  <div class="btns" style="margin-top:8px"><label class="btn out" style="text-align:center;cursor:pointer${up?";opacity:.6;pointer-events:none":""}">🎥 ${up?"Uploading "+S.vup+"%...":d.video?"Change video":"Add video (optional)"}<input type="file" accept="video/*" style="display:none" onchange="pickVideo(this)"></label>${d.video&&!up?`<button class="btn red" style="flex:none" onclick="clearVideo()">Remove</button>`:""}</div>
  <div class="muted" style="margin-top:4px;font-size:12px">Short video, up to 30 seconds and 25 MB. Customers can watch it on the item.</div></div>`;
}
function pickVideo(inp){
  const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  if(!/^video\//.test(f.type)){toast("Please choose a video file");return;}
  if(f.size>25*1024*1024){toast("Video is too big. Maximum 25 MB");return;}
  const url=URL.createObjectURL(f),v=document.createElement("video");
  v.preload="metadata";
  v.onloadedmetadata=async()=>{
    URL.revokeObjectURL(url);
    if(v.duration>31){toast("Video is too long. Maximum 30 seconds");return;}
    if(!S.draft)return;
    if(DM.on){S.draft.video=URL.createObjectURL(f);render();return;}
    S.vup=0;render();
    try{
      const ext=((f.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,""))||"mp4";
      const task=uploadBytesResumable(stRef(storage,"merchants/"+S.user.uid+"/videos/"+Date.now()+"."+ext),f,{contentType:f.type});
      task.on("state_changed",x=>{const q=Math.round(x.bytesTransferred/x.totalBytes*100);if(q!==S.vup){S.vup=q;if(S.draft)render();}});
      await task;
      if(S.draft)S.draft.video=await getDownloadURL(task.snapshot.ref);
      toast("Video added");
    }catch(e){toast("Video upload failed: "+(e.code||e.message));}
    S.vup=null;render();
  };
  v.onerror=()=>{URL.revokeObjectURL(url);toast("This video format is not supported");};
  v.src=url;
}
function clearVideo(){S.draft.video="";render();}
Object.assign(window,{pickVideo,clearVideo});

function itemData(d){
  const p=parseInt(d.price,10);
  if(!String(d.name||"").trim()){toast("Item ka naam likhein");return null;}
  if(!(p>0)){toast("Sahi price likhein");return null;}
  const mrp=parseInt(d.mrp,10);
  if(d.mrp&&!(mrp>p)){toast("Asli price, selling price se zyada honi chahiye");return null;}
  return {name:String(d.name).trim(),price:p,mrp:mrp>p?mrp:null,cat:d.cat||"Other",desc:d.desc||"",img:d.img||"",video:d.video||"",on:!!d.on,pop:!!d.pop,spicy:!!d.spicy,veg:!!d.veg,createdAt:d.createdAt||Date.now()};
}

    S.draft=null;render();toast("Item save ho gaya");

}

// ===== Earnings + Rewards =================================================
function stats(){
  const done=S.orders.filter(o=>o.status==="completed"),t=o=>o.completedAt||o.created||0;
  const now=new Date(),sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),som=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const today=done.filter(o=>t(o)>=sod),month=done.filter(o=>t(o)>=som);
  const days=[];
  for(let i=6;i>=0;i--){const s=sod-i*86400000,e=s+86400000,sum=done.filter(o=>t(o)>=s&&t(o)<e).reduce((a,o)=>a+(+o.total||0),0);days.push({d:i===0?"Aaj":new Date(s).toLocaleDateString("en",{weekday:"short"}),v:sum});}
  return {todayCount:today.length,todayEarn:today.reduce((a,o)=>a+(+o.total||0),0),month:month.length,days};
}
function earningsPage(){
  const st=stats(),max=Math.max(1,...st.days.map(x=>x.v)),avg=st.todayCount?Math.round(st.todayEarn/st.todayCount):0;
  const hist=S.orders.filter(o=>["completed","rejected","missed"].includes(o.status)).sort((a,b)=>(b.completedAt||b.closedAt||b.created)-(a.completedAt||a.closedAt||a.created)).slice(0,40);
  let h=`<div class="wrap"><div class="hero"><div style="opacity:.85;font-size:14px">Aaj ki kamai</div><div class="big">Rs ${st.todayEarn}</div><div style="margin-top:6px">${st.todayCount} orders &middot; average Rs ${avg}</div></div>
   <div class="card"><div style="font-weight:700">Pichhle 7 din</div><div class="chart">${st.days.map((x,i)=>`<div><i class="${i===6?"today":""}" style="height:${Math.max(4,x.v/max*100)}%"></i><span>${x.d}</span></div>`).join("")}</div></div>
   <div style="font-weight:700;margin:14px 4px 8px">Order history</div>`;
  if(!hist.length)h+=`<div class="empty">Abhi koi history nahi</div>`;
  hist.forEach(o=>{
    const tag=o.status==="completed"?'<span class="pill">Delivered</span>':(o.status==="rejected"?'<span class="pill red">Rejected</span>':'<span class="pill warn">Missed</span>');
    h+=`<div class="card item"><div onclick="openOrder('${o.id}')" style="cursor:pointer"><div style="font-weight:700">#${esc(String(o.id).slice(-4).toUpperCase())} &middot; ${esc(o.customer||"Customer")} ›</div><div class="muted">${hhmm(o.completedAt||o.closedAt||o.created)}</div></div><div style="text-align:right"><b>Rs ${esc(o.total||0)}</b><div style="margin-top:4px">${tag}</div><div style="margin-top:6px">${appealBtn(o)}</div></div></div>`;
  });
  return h+"</div>";
}
function rewardsPage(){
  const done=stats().month,max=TIERS[TIERS.length-1].orders,pct=Math.min(100,done/max*100);let nt=null,earned=0;
  TIERS.forEach(t=>{if(done>=t.orders)earned=t.amount;if(!nt&&done<t.orders)nt=t;});
  const msg=nt?`${nt.orders-done} orders aur karein aur Rs ${nt.amount} paayein`:"Mubarak! Sab se bara reward mil gaya.";
  let h=`<div class="wrap"><div class="hero"><div style="opacity:.85;font-size:14px">${PERIOD} ke completed orders</div><div class="big">${done}</div><div class="bar"><i style="width:${pct}%"></i></div><div>${msg}</div></div>
   <p style="font-weight:700;margin:6px 4px 12px">Ab tak kamaya hua reward: Rs ${earned}</p>`;
  TIERS.forEach(t=>{const ok=done>=t.orders;h+=`<div class="card tier"><div class="dot ${ok?"ok":""}">${ok?"✓":"🔒"}</div><div><div style="font-weight:700">${t.orders} orders se upar</div><div class="muted">${ok?"Unlocked":(t.orders-done)+" orders baaki"}</div></div><div class="amt">Rs ${t.amount}</div></div>`;});

// ===== OTP verification: email (EmailJS) + phone (Firebase Phone Auth) =====
const EJ={service:"YOUR_SERVICE_ID",template:"YOUR_TEMPLATE_ID",key:"YOUR_PUBLIC_KEY"};
const OT={};let PA=null,PV=null,EA=null;
const $o=i=>(document.getElementById(i)||{}).value||"";
const pE164=n=>{n=String(n||"").replace(/\D/g,"");return n.length===11&&n.startsWith("03")?"+92"+n.slice(1):null;};
async function sendEmailOtp(email){
  email=(email||"").trim().toLowerCase();OT.le=email;OT.err="";
  if(!/^\S+@\S+\.\S+$/.test(email)){toast("Email sahi nahi hai");render();return;}
  if(OT.e&&Date.now()-OT.e.at<60000){toast("60 second baad dobara bhejein");return;}
  if(EJ.key.startsWith("YOUR")){
    try{EA=EA||getAuth(initializeApp(firebaseConfig,"el"));await sendSignInLinkToEmail(EA,email,{url:location.origin+location.pathname,handleCodeInApp:true});
      localStorage.setItem("fbEmail",email);OT.link=email;OT.e=null;toast("Verify link email par bhej diya");}
    catch(x){OT.err="Email nahi gaya: "+(x.code||x.message);toast(OT.err);}
    render();return;}
  const code=String(crypto.getRandomValues(new Uint32Array(1))[0]%900000+100000);
  try{const r=await fetch("https://api.emailjs.com/api/v1.0/email/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service_id:EJ.service,template_id:EJ.template,user_id:EJ.key,template_params:{to_email:email,otp:code}})});
    if(!r.ok)throw new Error(await r.text());
    OT.e={email,code,exp:Date.now()+600000,tries:0,at:Date.now()};toast("OTP email par bhej diya");}
  catch(e){OT.err="Email OTP nahi gaya: "+e.message;toast(OT.err);}
  render();
}
function checkEmailOtp(v){
  const e=OT.e;if(!e)return;
  if(Date.now()>e.exp||++e.tries>5){toast("OTP expire ya bohat ghalat koshishein. Naya OTP mangwayein");OT.e=null;render();return;}
  if((v||"").trim()===e.code){A().emailOk=e.email;OT.e=null;toast("Email verify ho gaya ✅");}else toast("OTP ghalat hai");
  render();
}
async function sendPhoneOtp(n){
  const e=pE164(n);OT.lp=n;OT.err="";if(!e){toast("Number 03xx xxxxxxx format mein likhein");render();return;}
  try{PA=PA||getAuth(initializeApp(firebaseConfig,"ph"));try{PV&&PV.clear();}catch(x){}
    PV=new RecaptchaVerifier(PA,"rcp",{size:"invisible"});
    const conf=await signInWithPhoneNumber(PA,e,PV);OT.p={phone:n,conf};toast("OTP SMS se bhej diya");}
  catch(x){OT.err="SMS OTP nahi gaya: "+(x.code||x.message);toast(OT.err);}
  render();
}
async function checkPhoneOtp(v){
  if(!OT.p)return;
  try{const cr=await OT.p.conf.confirm((v||"").trim());try{await deleteUser(cr.user);}catch(x){try{await signOut(PA);}catch(y){}}A().phoneOk=OT.p.phone;OT.p=null;toast("Number verify ho gaya ✅");}
  catch(x){toast("OTP ghalat hai");}
  render();
}

function h12(h){h=((h%24)+24)%24;return (h%12||12)+(h<12?"am":"pm");}

function insightsPage(){

  const done=L.filter(o=>o.status==="completed"),rej=L.filter(o=>o.status==="rejected"),mis=L.filter(o=>o.status==="missed");
  const sum=a=>a.reduce((x,o)=>x+(+o.total||0),0),rev=sum(done),aov=done.length?Math.round(rev/done.length):0;

function histList(){
  const f=S.hf,q=(f.q||"").toLowerCase().trim(),from=f.r==="all"?0:sod(Date.now())-(+f.r-1)*864e5;
  return S.orders.filter(o=>["completed","rejected","missed"].includes(o.status)&&(f.st==="all"||o.status===f.st)&&ot(o)>=from&&(!q||(id4(o)+" "+(o.customer||"")+" "+(o.addr||"")+" "+(o.items||[]).join(" ")+" "+cphone(o)).toLowerCase().indexOf(q)>=0)).sort((a,b)=>ot(b)-ot(a));
}
function histItems(){
  const L=histList(),dn=L.filter(o=>o.status==="completed");
  if(!L.length)return `<div class="empty">Koi order nahi mila</div>`;
  return `<div class="muted" style="margin:2px 4px 10px">${L.length} orders &middot; ${dn.length} delivered &middot; Rs ${dn.reduce((a,o)=>a+(+o.total||0),0)}</div>`+
   L.slice(0,150).map(o=>`<div class="card item" onclick="openOrder('${o.id}')" style="cursor:pointer"><div style="min-width:0"><div style="font-weight:700">#${id4(o)} &middot; ${esc(o.customer||"Customer")}</div><div class="muted">${esc(fmtDT(ot(o)))} &middot; ${esc(o.pay||"")}</div><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw">${esc((o.items||[]).join(", "))}</div></div><div style="text-align:right"><b>Rs ${esc(o.total||0)}</b><div style="margin-top:4px">${stPill(o)}</div></div></div>`).join("")+
   (L.length>150?`<div class="muted" style="text-align:center">Pehle 150 dikhaye gaye. Sab ke liye CSV download karein.</div>`:"");
}
function histSearch(v){S.hf.q=v;$("#hlist").innerHTML=histItems();}
function setHf(k,v){S.hf[k]=v;render();}
function histPage(){
  const f=S.hf;
  return `<div class="wrap"><input type="text" placeholder="🔍 Order #, customer, item ya pata" value="${esc(f.q)}" oninput="histSearch(this.value)">
   <div class="chips" style="margin:8px 0 0">${[["all","Sab"],["completed","Delivered"],["rejected","Rejected"],["missed","Missed"]].map(x=>`<button class="tagc ${f.st===x[0]?"on":""}" style="margin:0" onclick="setHf('st','${x[0]}')">${x[1]}</button>`).join("")}</div>
   <div class="chips" style="margin:8px 0 12px">${[["1","Aaj"],["7","7 din"],["30","30 din"],["all","Sab"]].map(x=>`<button class="tagc ${f.r===x[0]?"on":""}" style="margin:0" onclick="setHf('r','${x[0]}')">${x[1]}</button>`).join("")}<button class="tagc" style="margin:0 0 0 auto;border-color:var(--primary);color:var(--primary)" onclick="exportCSV()">⬇️ CSV</button></div>
   <div id="hlist">${histItems()}</div></div>`;
}
function exportCSV(){
  const L=histList();if(!L.length){toast("Export ke liye koi order nahi");return;}
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows=[["Order","Date","Customer","Phone","Address","Items","Payment","Total (Rs)","Status","Reject wajah"]].concat(L.map(o=>["#"+id4(o),fmtDT(ot(o)),o.customer||"",cphone(o),o.addr||"",(o.items||[]).join(" | "),o.pay||"",o.total||0,o.status,o.rejectReason||""]));
  const blob=new Blob(["﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="orders-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(L.length+" orders ki CSV ban gayi");
}

  DM.menu={};M.forEach((m,i)=>{DM.menu["m"+i]={name:m.n,price:m.p,mrp:m.mrp||null,cat:m.c,desc:m.d||"",img:"",on:!!m.on,pop:!!m.pop,spicy:!!m.sp,veg:!!m.v,createdAt:now-i*1000};});
  const peak=[12,13,14,19,20,20,21,21,22,23];let k=0;
  const mk=(t,st,extra)=>{
    const c=DM_NAMES[(k++)%DM_NAMES.length],its=[],n=1+Math.floor(Math.random()*3);let tot=0;
    for(let i=0;i<n;i++){const m=dmR(M.filter(x=>x.on)),q=1+Math.floor(Math.random()*2);its.push(q+"x "+m.n);tot+=m.p*q;}
    const o={merchantId:"demo",status:st,customer:c[0],custPhone:c[1],addr:dmR(DM_ADDR),pay:Math.random()<.55?"Cash":"JazzCash",total:tot,items:its,createdAt:t-40*60000,custLoc:{lat:sh.lat+(Math.random()-.5)*.03,lng:sh.lng+(Math.random()-.5)*.03},...extra};
    DM.orders["h"+(k)]=o;return o;
  };
  for(let i=0;i<48;i++){
    let t;if(i<5)t=now-(i+1)*50*60000;else{const d=1+Math.floor(Math.random()*29),day=new Date(now-d*D);t=new Date(day.getFullYear(),day.getMonth(),day.getDate(),dmR(peak),Math.floor(Math.random()*60)).getTime();}
    const ready=t-(10+Math.floor(Math.random()*8))*60000;

function dmNewOrder(o){
  o=o||{};const c=o.rep?DM_NAMES[0]:dmR(DM_NAMES),mi=Object.values(DM.menu).filter(m=>m.on),items=[];let total=0;
  const n=1+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){const m=dmR(mi),q=1+Math.floor(Math.random()*2);items.push(q+"x "+m.name);total+=m.price*q;}
  const sh=shopLoc();

function dmBurst(){[0,1200,2400].forEach(ms=>setTimeout(()=>{if(DM.on)dmNewOrder();},ms));}
function dmDeliverAll(){
  let n=0;Object.values(DM.orders).forEach(o=>{if(["preparing","ready","onway"].includes(o.status)){o.status="completed";o.completedAt=Date.now();if(!o.riderName)o.riderName="Kamran (Rider)";n++;}});
  if(n){dmNotify();toast(n+" orders deliver ho gaye");}else toast("Koi active order nahi");
}
function dmSim(){
  if(!DM.on)return;const sh=shopLoc();let ch=false;
  const step=(a,b,k)=>({lat:a.lat+(b.lat-a.lat)*k,lng:a.lng+(b.lng-a.lng)*k});
  Object.values(DM.orders).forEach(o=>{
    if(o.status==="preparing"||o.status==="ready"){
      if(!o.riderName){o.riderName="Kamran (Rider)";o.riderPhone="03111234567";o.riderLoc={lat:sh.lat+0.012,lng:sh.lng-0.01};ch=true;}
      else if(o.riderLoc&&km(o.riderLoc,sh)>0.03){o.riderLoc=step(o.riderLoc,sh,.3);ch=true;}
    }else if(o.status==="onway"&&o.riderLoc){
      const c=o.custLoc||{lat:sh.lat+0.015,lng:sh.lng+0.01};
      if(km(o.riderLoc,c)<0.08){o.status="completed";o.completedAt=Date.now();}else o.riderLoc=step(o.riderLoc,c,.45);
      ch=true;
    }
  });
  if(ch)dmNotify();
}
